[project]
name = "kyungdong-reactor-dashboard"
version = "0.1.0"
description = "경동글로벌텍 반응기 통합 데이터 대시보드"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
